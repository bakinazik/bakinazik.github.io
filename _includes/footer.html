<footer class="footer" role="contentinfo">
  <p translate="no">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>

  <div class="lang-menu" id="lang-menu">
    <button type="button" id="lang-menu-trigger" class="lang-menu-trigger" data-i18n-aria-label="lang_switcher_aria" aria-haspopup="true" aria-expanded="false">
      <span class="fi" id="lang-menu-flag"></span>
      <span id="lang-menu-code"></span>
    </button>
    <div class="lang-menu-panel" id="lang-menu-panel" role="menu"></div>
  </div>

  <nav class="links" data-i18n-aria-label="social_nav_aria">
    {% for item in site.data.social %}
    {% if item.feeds %}
    <div class="rss-menu" id="rss-menu">
      <a href="{{ item.feeds[0].url | relative_url }}" id="rss-menu-trigger" aria-label="{{ item.label }}" aria-haspopup="true" aria-expanded="false">
        {% include social-icon.html icon=item.icon %}
      </a>
      <div class="rss-menu-panel" id="rss-menu-panel" role="menu">
        {% for feed in item.feeds %}
        <a href="{{ feed.url | relative_url }}" role="menuitem">{{ feed.label }}</a>
        {% endfor %}
      </div>
    </div>
    {% else %}
    <a href="{{ item.url }}" aria-label="{{ item.label }}" target="_blank" rel="noopener noreferrer">
      {% include social-icon.html icon=item.icon %}
    </a>
    {% endif %}
    {% endfor %}
  </nav>
</footer>
