<header class="profile-top">
  <div class="profile-identity" translate="no">
	  <div class="settings-menu" id="settings-menu">
		<button type="button" id="settings-menu-trigger" class="settings-menu-trigger" data-i18n-aria-label="settings_menu_aria" aria-haspopup="true" aria-expanded="false">
		  {% include social-icon.html icon="dots" %}
		</button>
		<div class="settings-menu-panel" id="settings-menu-panel" role="menu">

		  <div class="settings-accordion" id="settings-accordion">
			<button type="button" class="settings-accordion-trigger" data-accordion-target="theme-section" aria-expanded="false">
			  <span class="settings-accordion-trigger-label">
				{% include social-icon.html icon="palette" %}
				<span data-i18n="theme_label"></span>
			  </span>
			  {% include social-icon.html icon="chevron-right" %}
			</button>
			<button type="button" class="settings-accordion-trigger" data-accordion-target="lang-section" aria-expanded="false">
			  <span class="settings-accordion-trigger-label">
				{% include social-icon.html icon="language" %}
				<span data-i18n="language_label"></span>
			  </span>
			  {% include social-icon.html icon="chevron-right" %}
			</button>
			<button type="button" class="settings-accordion-trigger" data-accordion-target="font-size-section" aria-expanded="false">
			  <span class="settings-accordion-trigger-label">
				{% include social-icon.html icon="text-size" %}
				<span data-i18n="font_size_label"></span>
			  </span>
			  {% include social-icon.html icon="chevron-right" %}
			</button>
		  </div>

		  <div class="settings-menu-section" id="theme-section">
			<div class="settings-section-header" data-accordion-back>
			  <button type="button" class="settings-back-btn" data-i18n-aria-label="back_aria">{% include social-icon.html icon="back" %}</button>
			  <div class="settings-section-title" data-i18n="theme_label"></div>
			</div>
			<div class="settings-options" id="theme-menu-panel">
			  <button type="button" data-theme-option="system" data-i18n="theme_system"></button>
			  <button type="button" data-theme-option="dark" data-i18n="theme_dark"></button>
			  <button type="button" data-theme-option="light" data-i18n="theme_light"></button>
			</div>
		  </div>

		  <div class="settings-menu-section" id="lang-section">
			<div class="settings-section-header" data-accordion-back>
			  <button type="button" class="settings-back-btn" data-i18n-aria-label="back_aria">{% include social-icon.html icon="back" %}</button>
			  <div class="settings-section-title" data-i18n="language_label"></div>
			</div>
			<div class="settings-options" id="lang-menu-panel"></div>
		  </div>

		  <div class="settings-menu-section" id="font-size-section">
			<div class="settings-section-header" data-accordion-back>
			  <button type="button" class="settings-back-btn" data-i18n-aria-label="back_aria">{% include social-icon.html icon="back" %}</button>
			  <div class="settings-section-title" data-i18n="font_size_label"></div>
			</div>
			<div class="settings-options" id="font-size-menu-panel">
			  <button type="button" data-font-size-option="small" data-i18n="font_size_small"></button>
			  <button type="button" data-font-size-option="normal" data-i18n="font_size_normal"></button>
			  <button type="button" data-font-size-option="large" data-i18n="font_size_large"></button>
			</div>
		  </div>

		</div>
	  </div>
      <a href="{{ '/' | relative_url }}" data-site-title="{{ site.title }}" data-i18n-aria-label="home_aria" translate="no"><h1 class="profile-name">{{ site.title }}</h1></a>
  </div>

  <a href="{{ '/archive/' | relative_url }}" class="header-search" id="header-search">
    <span class="header-search-icon">{% include social-icon.html icon="search" %}</span>
    <span class="header-search-input" data-i18n="search_placeholder"></span>
  </a>


</header>
