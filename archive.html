---
layout: default
title: Arşiv
permalink: /archive/
---
<div class="archive-page">
  <div class="archive-search-bar">
    <span class="archive-search-icon">{% include social-icon.html icon="search" %}</span>
    <input type="search" id="archive-search-input" class="archive-search-input" data-i18n-placeholder="search_placeholder" autocomplete="off" autofocus>
    <button type="button" id="archive-search-clear" class="archive-search-clear" data-i18n-aria-label="close_aria">{% include social-icon.html icon="close" %}</button>
  </div>

  <div class="search-overlay-default" id="search-overlay-default">
    <div class="search-overlay-default-section" id="search-overlay-default-posts-section">
      <p class="search-overlay-default-title" data-i18n="tab_posts"></p>
      <div class="post-list-wrapper" id="search-overlay-default-posts"></div>
    </div>
    <div class="search-overlay-default-section" id="search-overlay-default-quotes-section">
      <p class="search-overlay-default-title" data-i18n="tab_quotes"></p>
      <div class="post-list-wrapper" id="search-overlay-default-quotes"></div>
    </div>
  </div>
  <p class="search-overlay-meta" id="search-overlay-meta"></p>
  <div class="post-list-wrapper" id="search-overlay-results"></div>
  <div class="no-result" id="search-overlay-empty">
    <p data-i18n="no_results"></p>
  </div>
</div>
