title: Baki Nazik
description: "Kişisel blog: yazılım, teknoloji ve günlük düşünceler."
url: "https://bakinazik.github.io"
baseurl: ""
author: Baki Nazik

permalink: /:year/:month/:title.html

plugins:
  - jekyll-feed
  - jekyll-paginate

paginate: 5
paginate_path: "/posts/page:num/"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  posts:
    output: true
  photos:
    output: false
  quotes:
    output: true
    permalink: /quotes/:year/:month/:title.html

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: quotes
    values:
      layout: quote

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
