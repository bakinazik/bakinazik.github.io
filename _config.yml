title: Baki Nazik
description: "Kişisel blog: yazılım, teknoloji ve günlük düşünceler."
url: "https://bakinazik.github.io"
baseurl: ""
author: Baki Nazik

permalink: /:year/:month/:title.html

plugins:
  - jekyll-feed

posts_batch_size: 5

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      post-type: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
