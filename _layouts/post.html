---
layout: default
---
<article id="post-{{ page.slug }}">
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" data-i18n-date="{{ page.date | date_to_xmlschema }}"></time>
      {% if page.tags.size > 0 %}
      ·
      {% for tag in page.tags %}<a href="{{ page.url | relative_url }}?search=%23{{ tag | url_encode }}">#{{ tag }}</a>{% unless forloop.last %} {% endunless %}{% endfor %}
      {% endif %}
    </div>
  </div>

  <div class="post-body">
    {{ content }}
  </div>
</article>
