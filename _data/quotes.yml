- text: Biyosentrizm ve ekosentrizm etrafında şekillenen utilitarizm, tanrı ahlakını
    gereklilik olmaktan çıkarabilir. Anlaşılması gereken nokta sistemin yine inanç
    temelli olacağıdır, ancak buradaki inanç tanrısal olguyu ifade etmediği gibi tanrı
    otoritesinin de yersiz olacağını söyler.
  date: Temmuz 14, 2024
- text: İdeolojilerin kahraman yaratma süreci toplumu homojenleştirebilir. İnançlı
    ve geleneksel bi anlayış özgürlük arayan azınlıkların olduğu toplumlarda kitlesel
    nefreti körükleyebilir. Kimlik siyaseti ile bir sonuca varılamayacağının farkında
    olunmalıdır.
  date: Temmuz 08, 2024
- text: Tür merkezciliğin getirisi, güç ve egemenlik hegemonyasıdır. Yüz yıl öncesine
    kadar tüm evrenin merkezinde olduğunu sanan insanlık, yaratılışçılığın cazibesine
    aldanmış ve ideal olduğu düşünülen dogmatik savların tesiri altında kalmıştır.
  date: Temmuz 07, 2024
- text: Pozitivizm yerini dataizm'e bırakırsa insanların ilerici kapitalist ve insan
    merkezci yaşamı artık bi gereklilik olmaktan çıkacaktır. Umalım da trans-hümanizm
    yanılmasın, yapay zeka ilk üç kurala sadık kalsın ve insanlığı parazit olarak
    nitelendirmesin.
  date: Temmuz 07, 2024
- text: Görme yetisi olanlar göremeyenlere görebilenlerin hayat idealini dayatır.
    Normatif değerler, ne yazık ki insanların aşağılık nefreti ve yargıları ile kuşatılmış
    durumdadır. Ya hepimiz kör olsaydık? Kör olanlar yeni kör olan bizleri hakimiyeti
    altına mı alacaktı?
  date: Temmuz 06, 2024
- text: Düğmeler, insanları hissiz ve duyarsız hale getirir. Bir düğmeye basıp rastgele
    bir şehri vurduğunuzu düşünün. Füzenin ulaştığı noktadaki insanların acısını deneyimlemeniz
    mümkün müdür? Eğer o düğmeye basan kişiyseniz, hiç sanmıyorum.
  date: Temmuz 05, 2024
- text: Günümüz tartışma kültürü bireysel eleştiriyi radikalize etmiş ve tartışmayı
    kazanma arzusunu tek önemli etken haline getirmiştir. Eleştirilerin sadece karşıt
    düşünceleri bastırma olarak anlaşılması eleştiri kavramının saldırı olarak nitelendirilmesine
    sebep olmuştur.
  date: Temmuz 04, 2024
- text: Anlamlandıramamışlık hali bilinmezlik ile eşdeğer değildir. Bir eyleme anlam
    yüklemek o eylemin daha değerli olabileceğine inanmaktır. İnsanlar varlıklarının
    aciz değersizliğini anlamlı acziyet ile taçlandırırlar.
  date: Temmuz 03, 2024
- text: İnançlı olanlar ahlaklı olmakla koşullandırılırlar. İnançsızlığa rağmen ahlaklı
    yaşayanlar ne güzel insanlardır. Ölümlü olmayı daha iyi bi amaç arayışı ile kabullenmişlerdir.
    Toplum onlar için ahlaklı olmak adına yeterli bi sebeptir.
  date: Temmuz 03, 2024
- text: Ölümü bilinmezlikten çıkarma şeklimiz ne ölçüde özgür olacağımızı belirler.
    Ölümle yaşayanlar zaten yaşamaktan bile korkmuşlardır. Ölümün ne kadar yakında
    olabileceğini en iyi onlar bilirler. En yaşamamış da onlardır. Özgür ruhlarını
    ölüm orada değilken ölümle zincirlemişlerdir.
  date: Temmuz 03, 2024
- text: Tanrı değilseniz yargısız infaz şımarıklığında bulunmayın. Sadece o bu kadar
    acizce bir kararı meşru sayabilir.
  date: Haziran 20, 2024
