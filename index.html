---
layout: default
tab: about
---
{% include tabs.html %}

<div class="profile-panels">

  <section class="profile-panel is-active" id="panel-about" role="tabpanel">
    <p class="about-intro" data-i18n="about_intro"></p>

    <div class="section-header">
      <h2 data-i18n="tab_projects"></h2>
    </div>
    <div id="projects-container">
      {% for project in site.data.projects %}
      <div class="project-item">
        <div class="project-left">
          <div class="project-icon">{% include social-icon.html icon="project" %}</div>
          <div class="project-meta">
            <div class="project-title">{{ project.title }}</div>
            <small>{{ project.meta }}</small>
          </div>
        </div>
        <div class="project-actions">
          {% for link in project.links %}
          <a href="{{ link.url }}" aria-label="{{ project.title }} - {{ link.label }}" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </section>

</div>
